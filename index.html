<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
</head>

<body>
    <!-- Navegação principal -->
    <div class="caixa-nav">
        <a href="#inicio" aria-label="Sushi Home - Página inicial">
            <img 
                src="assets/logo.sushi.png" 
                alt="Logo Sushi Home" 
                class="img-logo"
            >
        </a>

        <button class="menu-mobile" aria-label="Abrir menu" aria-expanded="false">
         ☰
        </button>

        <nav class="nav-links" aria-label="Navegação principal">
            <a href="#inicio" class="link-nav">Início</a>
            <a href="#cardapio" class="link-nav">Cardápio</a>
            <a href="#promocoes" class="link-nav">Promoções</a>
            <a href="#contato" class="link-nav">Contato</a>

            <a href="#contato" class="btn-nav">Pedir agora</a>
        </nav>
    </div>

    <main>
        <!-- Seção inicial -->
        <header class="caixa-header" id="inicio">

            <div class="conteudo-header">
                <h2>Bem-vindo ao</h2>
                <h1>SUSHI HOME</h1>

                <p>
                    O melhor da culinária japonesa até você!
                </p>

                <a href="#cardapio" class="btn-cardapio">
                    Ver cardápio
                </a>
            </div>
        </header>

        <!-- Separador visual -->
        <div class="linha" aria-hidden="true"></div>

        <!-- Seções principais -->
        <section class="caixa-basein" aria-label="Conheça a Sushi Home">

            <section class="caixa-info" id="cardapio">
               
            </section>

            <section class="caixa-info" id="promocoes">
               
            </section>

            <section class="caixa-info" id="contato">
               
            </section>

        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="footer-content">

            <div class="footer-logo">
                <a href="#inicio" aria-label="Voltar ao início">
                    <img 
                        src="assets/logo.sushi.png" 
                        alt="Sushi Home"
                    >
                </a>

                <p>
                    Seu sushi, do nosso lar para o seu.
                </p>
            </div>

            <nav class="footer-links" aria-label="Links do rodapé">
                <a href="#cardapio">Cardápio</a>
                <a href="#promocoes">Promoções</a>
                <a href="#contato">Contato</a>
            </nav>

            <div class="footer-contact">
                <a href="https://www.instagram.com/sushihome_2/">
                    📱 @sushihome_2
                </a>

                <a href="tel:+5583981287773">
                    📞 (83) 98128-7773
                </a>
            </div>

        </div>

        <div class="footer-bottom">
            <span>© 2026 Sushi Home. Todos os direitos reservados.</span>
            <span>Feito com 🧡 para você</span>
        </div>
    </footer>

    <script src="scripts.js" defer></script>
</body>

</html>
